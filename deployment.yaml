apiVersion: apps/v1
kind: Deployment

metadata:
  name: gitops-nginx

spec:
  replicas: 3

  selector:
    matchLabels:
      app: gitops-nginx

  template:
    metadata:
      labels:
        app: gitops-nginx

    spec:
      containers:
        - name: nginx
          image: nginx:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80